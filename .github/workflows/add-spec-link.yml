# feature_report.ymlのリンク部分と同時に修正・追加・削除をすること

name: Add Spec Link Comment

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-spec-link:
    runs-on: ubuntu-latest
    steps:
      - name: Post spec page link as comment
        uses: actions/github-script@v7
        with:
          script: |
            const urlMap = {
              "変更履歴": "https://nkzacjp-my.sharepoint.com/:x:/g/personal/nhs30106_nhs_hal_ac_jp/IQASBhsy1LBJTZ76GQPU3gknAZnHYgmc3kSP1ii2sYur7uU?e=tIhPul",
              "プレイヤー": "https://nkzacjp-my.sharepoint.com/:x:/g/personal/nhs30106_nhs_hal_ac_jp/IQASBhsy1LBJTZ76GQPU3gknAZnHYgmc3kSP1ii2sYur7uU?e=tIhPul",
            };

            const body = context.payload.issue.body || "";
            const match = body.match(/### 関連する仕様書ページ\s*\n\s*(.+)/);
            const selected = match ? match[1].trim() : null;

            if (!selected || !urlMap[selected]) {
              console.log("仕様書ページが本文から抽出できませんでした:", selected);
              return;
            }

            const url = urlMap[selected];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `📄 関連する仕様書ページ: [${selected}](${url})`
            });

            console.log(`リンクをコメントしました: ${selected} -> ${url}`);
